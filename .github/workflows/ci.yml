name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-pinned:
    name: test (pinned ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies with pinned constraints
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c constraints-pinned.txt

      - name: Verify installed versions
        run: |
          python -m pip show fastapi starlette httpx | grep -E "^(Name|Version):"

      - name: Anti-leak gate (deselected allowlist + substitute coverage)
        run: |
          python scripts/validate_deselection_ci.py

      - name: Run tests (skip integration; includes substitute coverage)
        run: |
          python -m pytest tests/ -m "not integration" -v

  test-latest:
    name: test (latest ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (latest compatible)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify installed versions
        run: |
          python -m pip show fastapi starlette httpx | grep -E "^(Name|Version):"

      - name: Anti-leak gate (deselected allowlist + substitute coverage)
        run: |
          python scripts/validate_deselection_ci.py

      - name: Run tests (skip integration; includes substitute coverage)
        run: |
          python -m pytest tests/ -m "not integration" -v

  test-integration:
    name: integration (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Anti-leak gate (deselected allowlist + substitute coverage)
        run: |
          python scripts/validate_deselection_ci.py

      - name: Run integration tests
        run: |
          python -m pytest tests/ -m "integration" -v
