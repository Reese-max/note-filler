[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "note_filler"
version = "0.1.0"
description = "法律/行政/考試筆記自動補齊(研究層用 grok,原稿不可變,無來源不進正文)"
requires-python = ">=3.11"
dependencies = [
    "python-docx>=1.1.0",
    "fastapi>=0.110.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "ddgs>=9.0.0",
    "trafilatura>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0", "anyio>=4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 讓 pytest 把本 checkout 的 src 插到 sys.path 最前——worktree/多 checkout 驗證時
# 壓過共用 venv 裡指向主專案的 editable install,確保驗到的是當前 checkout 的碼
pythonpath = ["src"]
# 專案用 anyio (pytest.mark.anyio),不需要 pytest-asyncio 的 asyncio plugin；
# 它會自動載入並觸發 PytestDeprecationWarning (asyncio_default_fixture_loop_scope 未設)
addopts = "-p no:asyncio -W error::DeprecationWarning -W error::PendingDeprecationWarning"
markers = [
    "integration: 需要真實 grok(:8318)的整合測試;平時用 -m 'not integration' 跳過",
]
