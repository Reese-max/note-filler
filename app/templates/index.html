<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>筆記補齊</title>
</head>
<body>
  <h1>筆記補齊</h1>
  <p>上傳筆記(.txt 或 .docx),系統將保留原稿、以差異方式補齊。</p>
  <form action="/run" method="post" enctype="multipart/form-data">
    <input type="file" name="file" accept=".txt,.docx" required>
    <button type="submit">開始補齊</button>
  </form>
</body>
</html>
